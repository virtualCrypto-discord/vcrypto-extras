name: release

# A release is a tag: the pinned commit is checked, migrated, deployed and
# told to Discord. `workflow_dispatch` is the same run by hand, for a deploy
# that has to be repeated without moving a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # Deployments do not interleave: one release runs, the next queues.
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # The same gates as `ci` — a tag can point at a commit that never went
      # through them.
      - run: npm run check

      # The schema first: a worker that expects a table the database does not
      # have fails on its first request, and this is the step a rollback of the
      # worker cannot undo.
      - name: Apply the database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply vcrypto-extras --remote

      - name: Deploy the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # A bulk overwrite, so this is what makes Discord match the tag: a
      # command added in the release exists after this, and one removed is
      # gone.
      - name: Register the commands with Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
        run: node scripts/register-commands.ts
